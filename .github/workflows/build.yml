name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Crea la parte Android
        run: flutter create --platforms=android --project-name=inbox_shield --org=it.luigi .
      - run: rm -rf test
      - run: python3 tools/prepara_android.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: inbox-shield-apk, path: build/app/outputs/flutter-apk/app-release.apk }
